{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feed</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        .sidebar {
            width: 220px;
        }
        .feed-box {
            max-width: 420px;
            aspect-ratio: 9 / 16;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }
        .feed-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .actions button {
            background: none;
            border: none;
            color: white;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row min-vh-100">

        <div class="col-auto sidebar d-none d-md-flex flex-column p-3">
            <h5 class="mb-4">Software Engineering Project</h5>
            <div class="mb-2">For You</div>
            <div class="mb-2">Explore</div>
            <div class="mb-2">Following</div>
            <div class="mb-2">Upload</div>
            <div class="mt-auto">
                {% if user.is_authenticated %}
                    <div class="text-success mb-2">Logged in as {{ user.username }}</div>
                    <button id="logoutBtn" class="btn btn-danger w-100">Logout</button>
                {% else %}
                    <button class="btn btn-primary w-100 mb-2" data-bs-toggle="modal" data-bs-target="#loginModal">
                        Log in
                    </button>

                    <button class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#signupModal">
                        Sign up
                    </button>
                {% endif %}
            </div>
        </div>

        <div class="col d-flex justify-content-center align-items-center">
            <div class="d-flex gap-3">

                <div class="feed-box">
                    <img src="{% static 'img/test.webp' %}" alt="Feed image">
                </div>

                <div class="actions d-flex flex-column justify-content-end gap-3 pb-4">
                    <button>❤</button>
                    <button>💬</button>
                    <button>↗</button>
                </div>

            </div>
        </div>

    </div>
</div>

<div class="modal fade" id="loginModal">
  <div class="modal-dialog">
    <div class="modal-content p-4">

      <form method="post" action="/login">
        {% csrf_token %}

        <h5 class="mb-3">Login</h5>

        <input name="username" placeholder="Username" class="form-control mb-3">

        <input name="password" type="password" placeholder="Password" class="form-control mb-3">

        <button class="btn btn-primary w-100">
            Login
        </button>

      </form>

    </div>
  </div>
</div>

<div class="modal fade" id="signupModal">
  <div class="modal-dialog">
    <div class="modal-content p-4">

      <form method="post" action="/signup">
        {% csrf_token %}

        <h5 class="mb-3">Sign up</h5>

        <input name="username" placeholder="Username" class="form-control mb-3">

        <input name="email" placeholder="Email" class="form-control mb-3">

        <input name="password" type="password" placeholder="Password" class="form-control mb-3">

        <button class="btn btn-primary w-100">
            Sign up
        </button>

      </form>

    </div>
  </div>
</div>

<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/home.js' %}"></script>
</body>
</html>
