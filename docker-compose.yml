services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: se_test
      MYSQL_USER: se_shamir
      MYSQL_PASSWORD: se_pass
      MYSQL_ROOT_PASSWORD: root_pass

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

  web:
    build: .
    command: /bin/sh -c "python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8080 se_test.wsgi:application"
    ports:
      - "8000:8080"
    # volumes:
    #   - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
